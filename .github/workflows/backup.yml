name: Firestore Nightly Backup

on:
  schedule:
    # Runs daily at 03:00 UTC (08:30 IST)
    - cron: "0 3 * * *"
  workflow_dispatch: {} # allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        # The repo's pinned dependencies, not a floating install. An unpinned
        # `npm install firebase-admin` picked up v14 on its own and the backup
        # failed silently on 11 and 12 Sep.
        run: npm ci --omit=dev

      - name: Run backup
        env:
          FIREBASE_ADMIN_KEY: ${{ secrets.FIREBASE_ADMIN_KEY }}
        run: node scripts/backup-firestore.js

      - name: Upload backup artifact
        if: success() # skip when the backup step failed (avoids a misleading "no files" error)
        uses: actions/upload-artifact@v4
        with:
          name: firestore-backup-${{ github.run_id }}
          path: backups/
          retention-days: 30
          if-no-files-found: error
